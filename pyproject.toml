[project]
name = "ai-challenge-2026"
version = "0.1.0"
description = "AI Challenge HCMC 2026 Multimodal Video Retrieval Engine"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymilvus>=2.4.0",
    "elasticsearch>=8.7.0",
    "motor>=3.4.0",
    "beanie>=1.25.0",
    "minio>=7.2.0",
    "aioboto3>=12.4.0",
    "prefect>=3.0.0",
    "streamlit>=1.40.0",
    "structlog>=24.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "timm>=0.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "open-clip-torch>=2.24.0",
    "huggingface-hub>=0.23.0",
    "gdown>=5.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Multimodal SOTA Pipeline Dependencies
    "paddleocr>=2.7.0",
    "paddlepaddle-gpu>=2.6.0; sys_platform == 'linux'",
    "paddlepaddle>=2.6.0; sys_platform != 'linux' and python_version < '3.14'",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "silero-vad>=5.0.0",
    "moviepy>=1.0.3",
    "pydub>=0.25.1",
    "rapidfuzz>=3.6.0",
    "ultralytics>=8.2.0",
    "transformers>=4.45.0",
    "qwen-vl-utils>=0.0.8",
    "accelerate>=0.29.0",
    "scikit-image>=0.21.0",
    "scenedetect>=0.6.2",
    "tqdm>=4.66.0",
    "supervision>=0.19.0",
    "ram @ git+https://github.com/xinyu1205/recognize-anything.git",
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
    "transnetv2-pytorch>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipelines", "eval"]

[tool.uv]
override-dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
torchaudio = { index = "pypi" }
torchvision = { index = "pypi" }

